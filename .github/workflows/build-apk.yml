
name: Build Rybalka PRO APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -o RybalkaPRO_Android_Package_v2.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/RybalkaPRO_Native_Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RybalkaPRO-APK
          path: extracted/RybalkaPRO_Native_Android/app/build/outputs/apk/debug/app-debug.apk

